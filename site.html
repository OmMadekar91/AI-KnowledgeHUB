<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeHUB | Document Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;       /* Indigo */
            --primary-hover: #4338ca;
            --bg: #0f172a;            /* Deep Slate */
            --card-bg: #1e293b;       /* Charcoal */
            --border: #334155;        /* Muted Slate */
            --text-main: #f8fafc;     /* White */
            --text-muted: #94a3b8;    /* Gray */
            --accent: #10b981;        /* Emerald */
            --danger: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        nav {
            padding: 1rem 8%;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { 
            font-weight: 700; font-size: 1.2rem; color: var(--text-main);
            display: flex; align-items: center; gap: 10px; 
        }

        .dashboard-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
            padding: 40px 8%; max-width: 1400px; margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card-header { 
            display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        h3 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }

        .drop-zone { 
            border: 2px dashed var(--border); 
            border-radius: 8px; padding: 30px; 
            text-align: center; cursor: pointer; transition: 0.2s; 
        }
        .drop-zone:hover { border-color: var(--primary); background: rgba(255,255,255,0.02); }
        
        .btn { 
            background: var(--primary); color: white; border: none; 
            padding: 12px; border-radius: 8px; font-weight: 600; 
            cursor: pointer; width: 100%; transition: 0.2s; 
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn:disabled { background: var(--border); cursor: not-allowed; }

        #queryInput {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            padding: 14px 16px; border-radius: 8px; color: white; 
            margin-bottom: 12px; outline: none; box-sizing: border-box;
            font-size: 0.9rem;
        }

        .stat-box { background: var(--bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .emoji-display { font-size: 2rem; margin-bottom: 8px; }
        
        .summary-box { background: rgba(79, 70, 229, 0.1); border-radius: 8px; padding: 16px; border-left: 4px solid var(--primary); margin-bottom: 20px; font-size: 0.95rem; line-height: 1.6; }

        .key-points-box { background: rgba(255, 255, 255, 0.02); border-radius: 8px; padding: 18px; border: 1px solid var(--border); }
        .key-points-list { font-size: 0.85rem; color: var(--text-muted); padding-left: 1.2rem; margin: 0; }
        .key-points-list li { margin-bottom: 8px; }

        .btn-action { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { color: var(--danger); border-color: var(--danger); }

        .source-tag { font-size: 0.65rem; color: var(--text-muted); background: var(--bg); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); }

        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <div class="logo"><i class="fas fa-microchip"></i> KNOWLEDGEHUB AI</div>
    <div style="font-size: 0.7rem; color: var(--accent); font-weight: 600;"><i class="fas fa-circle" style="font-size: 0.5rem;"></i> ENGINE ACTIVE</div>
</nav>

<div class="dashboard-grid">
    <div class="card">
        <div class="card-header"><h3><i class="fas fa-upload"></i> Data Ingestion</h3></div>
        <div class="drop-zone" onclick="document.getElementById('pdfInput').click()">
            <i class="fas fa-file-pdf" style="font-size: 2rem; color: var(--primary-light); margin-bottom: 12px;"></i><br>
            <span id="dropText" style="color: var(--text-muted); font-size: 0.85rem;">Load Academic Document</span>
            <input type="file" id="pdfInput" hidden onchange="updateFileName()">
        </div>
        <button class="btn" style="margin-top: 20px;" onclick="handleUpload()">Train Assistant</button>
    </div>

    <div class="card">
        <div class="card-header"><h3><i class="fas fa-server"></i> System Status</h3></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="stat-box">
                <div id="aiEmoji" class="emoji-display">🤖</div>
                <div id="statusLabel" style="font-size: 0.65rem; letter-spacing: 1px; font-weight: 700;">AI READY</div>
            </div>
            <div class="stat-box">
                <div id="docCount" class="emoji-display" style="font-weight: 700;">0</div>
                <div style="font-size: 0.65rem; letter-spacing: 1px; font-weight: 700;">FILES IN DB</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-database"></i> Knowledge Vault</h3>
            <button class="btn-action" onclick="wipeAllData()"><i class="fas fa-trash"></i> Reset System</button>
        </div>
        <div id="fileList" style="max-height: 160px; overflow-y: auto;"></div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-brain"></i> AI Assistant</h3>
            <button class="btn-action" onclick="clearAssistant()"><i class="fas fa-eraser"></i> Clear</button>
        </div>
        <input type="text" id="queryInput" placeholder="Enter query for data extraction...">
        <button class="btn" id="askBtn" onclick="handleSearch()">Execute Retrieval</button>
        
        <div id="searchResults" style="margin-top: 25px;">
            <p style="text-align: center; opacity: 0.4; font-size: 0.8rem;">Awaiting input...</p>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:5000";

    function updateStatus(state) {
        const emoji = document.getElementById('aiEmoji');
        const label = document.getElementById('statusLabel');
        const states = {
            'idle': { icon: '🤖', text: 'AI READY' },
            'working': { icon: '⚙️', text: 'PROCESSING' },
            'success': { icon: '✅', text: 'COMPLETE' },
            'error': { icon: '❌', text: 'SYSTEM ERR' }
        };
        if (states[state]) {
            emoji.innerText = states[state].icon;
            label.innerText = states[state].text;
        }
    }

    function updateFileName() {
        const input = document.getElementById('pdfInput');
        const dropText = document.getElementById('dropText');
        if(input.files[0]) {
            dropText.innerText = input.files[0].name;
            dropText.style.color = "var(--text-main)";
        }
    }

    function clearAssistant() {
        document.getElementById('queryInput').value = "";
        document.getElementById('searchResults').innerHTML = '<p style="text-align: center; opacity: 0.4; font-size: 0.8rem;">Assistant reset.</p>';
        updateStatus('idle');
    }

    async function handleUpload() {
        const input = document.getElementById('pdfInput');
        const dropText = document.getElementById('dropText');
        if(!input.files[0]) return;
        
        updateStatus('working');
        const formData = new FormData();
        formData.append('pdf_file', input.files[0]);
        
        try {
            const res = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
            if(res.ok) {
                updateStatus('success');
                loadFiles();
                input.value = ""; 
                dropText.innerText = "Load Academic Document";
                dropText.style.color = "var(--text-muted)";
            } else { throw new Error("Upload failed"); }
        } catch (e) { updateStatus('error'); }
    }

    async function handleSearch() {
        const query = document.getElementById('queryInput').value;
        const resDiv = document.getElementById('searchResults');
        const askBtn = document.getElementById('askBtn');
        if(!query) return;

        askBtn.disabled = true;
        updateStatus('working');
        resDiv.innerHTML = `<p style="text-align:center; opacity:0.6; font-size:0.8rem;"><i class="fas fa-spinner fa-spin"></i> Retrieving relevant chunks...</p>`;

        try {
            const response = await fetch(`${API_URL}/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ q: query })
            });
            const data = await response.json();
            const sa = data.structured_answer;

            const keyPointsHtml = sa.key_points.map(point => `<li>${point}</li>`).join('');

            resDiv.innerHTML = `
                <div class="summary-box">${sa.summary}</div>
                <div class="key-points-box">
                    <h4 style="margin:0 0 12px 0; color:var(--text-main); font-size:0.7rem; text-transform:uppercase; letter-spacing:1px;">Verified Key Findings</h4>
                    <ul class="key-points-list">${keyPointsHtml}</ul>
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; border-top: 1px solid var(--border); padding-top:12px;">
                    ${data.sources.map(s => `<span class="source-tag"><i class="far fa-file"></i> ${s.file} (p.${s.page})</span>`).join('')}
                </div>
            `;
            updateStatus('success');
        } catch (e) { 
            updateStatus('error'); 
            resDiv.innerHTML = `<p style="color:var(--danger); text-align:center; font-size:0.8rem;">Query failed to execute.</p>`; 
        } finally { askBtn.disabled = false; }
    }

    async function wipeAllData() {
        if(!confirm("Format AI memory and clear all documents?")) return;
        await fetch(`${API_URL}/wipe_all`, { method: 'POST' });
        loadFiles();
        clearAssistant();
    }

    async function loadFiles() {
        try {
            const res = await fetch(`${API_URL}/files`);
            const data = await res.json();
            document.getElementById('docCount').innerText = data.files.length;
            document.getElementById('fileList').innerHTML = data.files.map(f => `
                <div style="padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:6px; margin-bottom:8px; font-size:0.75rem; display:flex; align-items:center;">
                    <i class="fas fa-file-pdf" style="color:var(--danger); margin-right:10px;"></i> ${f}
                </div>
            `).join('');
        } catch(e) {}
    }

    window.onload = loadFiles;
</script>
</body>
</html>
