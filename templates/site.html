<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeHub | Enterprise RAG AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        nav {
            padding: 1.2rem 5%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { color: white; font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .status-badge { font-size: 0.65rem; background: #10b981; color: white; padding: 4px 10px; border-radius: 20px; letter-spacing: 1px; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            padding: 30px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Order remains as you structured it */
        .card:nth-child(1) { order: 1; }
        .card:nth-child(4) { order: 2; }
        .card:nth-child(3) { order: 3; }
        .card:nth-child(2) { order: 4; }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h3 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 12px; }
        h3 i { color: var(--primary); }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            background: #f8fafc;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
        }

        .btn {
            background: var(--bg);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s;
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-ghost { background: none; color: var(--text-muted); border: 1px solid #e2e8f0; padding: 8px 12px; font-size: 0.8rem; }

        .response-container { margin-top: 15px; }
        .summary-box { background: #eff6ff; border-radius: 12px; padding: 15px; font-weight: 600; border-left: 4px solid var(--primary); margin-bottom: 15px; }
        .details-text { line-height: 1.6; color: #334155; margin-bottom: 15px; }
        .bullet-list { padding-left: 20px; margin-bottom: 15px; }
        .bullet-list li { margin-bottom: 5px; color: #475569; }

        .source-tag { font-size: 0.7rem; background: #f1f5f9; padding: 4px 10px; border-radius: 6px; border: 1px solid #e2e8f0; margin-right: 5px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center; }
        .stat-box { background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #f1f5f9; }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <div class="logo"><i class="fas fa-microchip"></i> KNOWLEDGEHUB AI</div>
    <div class="status-badge">GEMINI 3 ENGINE ACTIVE</div>
</nav>

<div class="dashboard-grid">
    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-cloud-upload-alt"></i> Data Ingestion</h3>
        </div>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
            <i class="fas fa-file-pdf fa-2x" style="color:#94a3b8; margin-bottom:10px;"></i><br>
            <span id="dropText" style="font-weight:600;">Click to Upload Enterprise PDFs</span>
            <input type="file" id="pdfInput" hidden accept=".pdf" onchange="updateFileName()">
        </div>
        <button class="btn" id="uploadBtn" style="margin-top: 20px;" onclick="handleUpload()">
            <span id="uploadBtnText">Ingest Knowledge</span>
        </button>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-brain"></i> AI Intelligence</h3>
            <button class="btn btn-ghost" onclick="clearSearch()"><i class="fas fa-trash"></i> Clear</button>
        </div>
        <div class="search-box">
            <input type="text" id="queryInput" placeholder="Ask about your documents..." style="width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 10px;">
            <button class="btn" id="askBtn" onclick="handleSearch()">Query Assistant</button>
        </div>
        <div id="searchResults" style="margin-top:15px; overflow-y:auto; max-height:400px;">
            <p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:30px;">Results appear here.</p>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-folder-open"></i> Managed Repository</h3>
        </div>
        <div id="fileList"></div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-chart-pie"></i> System Analytics</h3>
        </div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="docCount">0</div>
                <div class="stat-label">Documents</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">3.0</div>
                <div class="stat-label">Gemini Rev</div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:5000";

    function updateFileName() {
        const input = document.getElementById('pdfInput');
        if(input.files[0]) document.getElementById('dropText').innerText = input.files[0].name;
    }

    async function handleUpload() {
        const input = document.getElementById('pdfInput');
        const dropText = document.getElementById('dropText');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadBtnText = document.getElementById('uploadBtnText');
        const file = input.files[0];
        
        if(!file) return alert("Select a PDF");
        
        // UI - Start Loading State
        uploadBtn.disabled = true;
        uploadBtnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Ingesting...';
        
        const formData = new FormData();
        formData.append('pdf_file', file);
        
        try {
            await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
            loadFiles();
            alert("Upload Successful");
        } catch (err) {
            alert("Upload failed");
        } finally {
            // UI - Reset Button and Automatically clear file name
            uploadBtn.disabled = false;
            uploadBtnText.innerText = 'Ingest Knowledge';
            
            // AUTOMATIC RESET
            input.value = ""; 
            dropText.innerText = "Click to Upload Enterprise PDFs";
        }
    }

    async function handleSearch() {
        const query = document.getElementById('queryInput').value;
        const resDiv = document.getElementById('searchResults');
        if(!query) return;

        resDiv.innerHTML = `<p style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> Analyzing Knowledge...</p>`;

        try {
            const response = await fetch(`${API_URL}/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ q: query })
            });
            const data = await response.json();
            const sa = data.structured_answer;

            let html = `
                <div class="response-container">
                    <div class="summary-box">${sa.summary}</div>
                    <div class="details-text">${sa.details}</div>
                    <ul class="bullet-list">
                        ${sa.key_points.map(pt => `<li>${pt}</li>`).join('')}
                    </ul>
                    <div style="font-size:0.7rem; color:var(--text-muted);">Confidence Score: ${sa.confidence}</div>
                </div>
                <div style="margin-top:15px;">
                    ${data.sources.map(s => `<span class="source-tag">${s.file} (p. ${s.page})</span>`).join('')}
                </div>
            `;
            resDiv.innerHTML = html;
        } catch (err) { resDiv.innerHTML = "Error loading response."; }
    }

    function clearSearch() {
        document.getElementById('queryInput').value = "";
        document.getElementById('searchResults').innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:30px;">Results appear here.</p>';
    }

    async function loadFiles() {
        try {
            const res = await fetch(`${API_URL}/files`);
            const data = await res.json();
            document.getElementById('docCount').innerText = data.files.length;
            document.getElementById('fileList').innerHTML = data.files.map(f => `
                <div style="display:flex; justify-content:space-between; padding:10px; background:#f8fafc; border-radius:8px; margin-bottom:5px; font-size:0.85rem;">
                    <span>${f}</span>
                    <i class="fas fa-trash-alt" style="color:#ef4444; cursor:pointer;" onclick="deleteFile('${f}')"></i>
                </div>
            `).join('');
        } catch(e) { console.error("Could not load files"); }
    }

    async function deleteFile(f) {
        if(!confirm(`Delete ${f}?`)) return;
        await fetch(`${API_URL}/delete/${f}`, { method: 'DELETE' });
        loadFiles();
    }

    window.onload = loadFiles;
</script>
</body>
</html>
